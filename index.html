<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script> <!-- linking js file -->
    <link rel="stylesheet" href="styles.css"> <!-- linking html file -->
</head>
<body>
    <h1 id="title"> Wild West Haunting </h1> <!-- title at top -->
    <div class="imageDiv"> <!-- image display and tooltip logic on html side -->
        <img src="./images/Call2Action.png" alt="scene" id="scene">
        <div class="tooltip">4202</div> <!-- tooltip and what it should display -->
    </div>
    <p id="text"></p> <!-- text used to tell story -->
    <p id="endText"> The End </p> <!-- text to display at the end and below that is the special text saying that you need a passcode for one of the parts to move along -->
    <p id="padCodeText">Looks Like you need a passcode, Try to see if there is anything that could be a passcode in the previous rooms.</p>
    <p id="thanksText"> Thanks For Playing </p> <!-- text that is revealed at the end with a button thanking the player for playing -->
    <button id="next">Next</button> <!-- html side of standard button progress scene-->
    <button id="prev">Previous</button> <!-- html side of standard button one scene back-->
    <button id="toOutside" class="hidden">To Outside</button> <!-- html side of button to go to scene around the house-->
    <button id="toPorch" class="hidden">To Porch</button> <!-- html side of button to go to porch-->
    <button id="toLHallway" class="hidden">To Left Hallway</button> <!-- html side of button to enter left hallway-->
    <button id="toRHallway" class="hidden">To Right Hallway</button> <!-- html side of button to enter right hallway-->
    <button id="backToLiving">back to living</button> <!-- html side of button to enter back into living room -->
    <button id="toAttic">to Attic</button> <!-- html side of button to enter attic-->
    <button id="backToRHallway">back to Right Hallway</button> <!-- html side of button to re enter right hallway-->
    <button id="toSecretRoom">To Secret Room</button> <!-- --><!-- html side of button to access secret room-->
    <button id="revealKey">Pickup Key</button> <!-- html side of button that changes status of key to true -->
    <button id="tryHallwayDoor">try door</button><!-- html side of function that reveals extra buttons for accessing code for the long hallway -->
    <button id="tryCode">Enter Code</button> <!-- html side of button to access the long hallway-->
    <button id="thanks"> --- </button> <!-- html side of button that reveals a thank you message for the user at the end -->
</body>
</html>
